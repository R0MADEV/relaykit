# A second homeserver, of a different make, for development only.
#
# Everything else in this project is checked against Synapse. A library that only works against the server it
# was written against is not a library for Matrix, it is a library for Synapse, and nothing so far could tell
# the difference.
version: 2

global:
  server_name: dendrite.local
  private_key: /etc/dendrite/keys/matrix_key.pem
  database:
    connection_string: postgresql://dendrite:dendrite@dendrite-postgres/dendrite?sslmode=disable
    max_open_conns: 20
    max_idle_conns: 5
    conn_max_lifetime: -1
  # Dendrite brings presence turned off. Synapse brings it on, and a check that works against one and not the
  # other because of a default says nothing about the library.
  presence:
    enable_inbound: true
    enable_outbound: true
  jetstream:
    in_memory: true
    storage_path: /var/dendrite/

client_api:
  # The checks make their own accounts, as they do against Synapse. Development only.
  registration_disabled: false
  guests_disabled: true
  registration_requires_token: false
  # What `create-account` needs to make the three accounts the checks expect. Development only, and it is in
  # this file, which is reason enough never to use it anywhere real.
  registration_shared_secret: "relaykit-development-only"
  rate_limiting:
    enabled: false

sync_api:
  real_ip_header: X-Real-IP

media_api:
  base_path: /var/dendrite/media
  max_file_size_bytes: 10485760

user_api:
  auto_join_rooms: []

logging:
  - type: std
    level: warn
