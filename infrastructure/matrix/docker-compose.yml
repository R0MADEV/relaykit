services:
  # Synapse dice que SQLite es solo para pruebas. Un entorno de desarrollo que no se parece al de produccion
  # mide cosas que a nadie le pasan, asi que aqui va la misma base de datos que se usa en serio.
  postgres:
    image: postgres:16-alpine
    container_name: relaykit-postgres
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse
      POSTGRES_DB: synapse
      # Synapse exige esta intercalacion. Con cualquier otra se niega a arrancar, y hace bien: ordenar
      # distinto rompe las busquedas y las claves.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Lo que un telefono tendria detras. Aqui solo apunta lo que le llega, para que una comprobacion pueda
  # mirar si el homeserver entrega de verdad y si lo dicho se queda entre los dispositivos.
  push-gateway:
    image: node:22-alpine
    container_name: relaykit-push-gateway
    command: node /app/gateway.mjs
    volumes:
      - ./push-gateway:/app:ro
    ports:
      - "8090:8080"

  # Somewhere to sign in that is not the homeserver, so the single sign-on path is exercised against a real
  # identity provider instead of assumed.
  dex:
    image: ghcr.io/dexidp/dex:latest
    container_name: relaykit-dex
    command: dex serve /etc/dex/dex.yaml
    volumes:
      - ./dex.yaml:/etc/dex/dex.yaml:ro
    ports:
      - "5556:5556"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:5556/dex/.well-known/openid-configuration"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Somewhere for the homeserver to send email to. Adding an address to an account and resetting a forgotten
  # password both end in a message nobody here can read otherwise, and a check that cannot read it can only
  # assert that the request was accepted — which is the half that was never in doubt.
  mail:
    image: axllent/mailpit:latest
    container_name: relaykit-mail
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8025/api/v1/info"]
      interval: 3s
      timeout: 3s
      retries: 20

  synapse:
    image: matrixdotorg/synapse:latest
    container_name: relaykit-synapse
    environment:
      SYNAPSE_SERVER_NAME: localhost
      SYNAPSE_REPORT_STATS: "no"
    volumes:
      - ./data:/data
    ports:
      - "8008:8008"
      - "8448:8448"
    # El gateway de notificaciones corre fuera del contenedor, y el homeserver tiene que poder alcanzarlo por
    # nombre. En Docker Desktop existe; en Linux, que es donde corre la integracion continua, hay que decirlo.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      dex:
        condition: service_healthy
      mail:
        condition: service_healthy

volumes:
  postgres-data:
