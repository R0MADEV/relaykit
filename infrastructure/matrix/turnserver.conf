# A relay for calls, for development only.
#
# Two people each behind their own router cannot reach one another directly: the addresses they offer mean
# nothing outside their own network. This is the way out, and the homeserver hands out the credentials for it.
#
# NOT FOR PRODUCTION. The secret is in this file and in the homeserver's, there is no TLS, and the relay is
# open to whatever can reach it.
listening-port=3478
realm=localhost
server-name=localhost

# The homeserver makes credentials out of this same secret, so nothing has to be registered here in advance.
use-auth-secret
static-auth-secret=relaykit-development-only

# Where the traffic that is relayed goes out. Kept small on purpose: every one of these has to be published by
# Docker, and a wide range makes the container slow to start.
min-port=49160
max-port=49200

# Development runs over plain http and there are no certificates here to use.
no-tls
no-dtls

# A relay that can be pointed at a private network is a way into it. None of this is needed to place a call.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
no-multicast-peers
