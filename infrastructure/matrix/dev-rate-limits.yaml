# Limites de peticiones para desarrollo y CI. Los tests crean muchas salas y envian muchos mensajes
# seguidos, y los valores por defecto de Synapse los rechazan con 429. No usar en produccion.
rc_message:
  per_second: 100
  burst_count: 500
rc_room_creation:
  per_second: 50
  burst_count: 200
rc_joins:
  local:
    per_second: 100
    burst_count: 500
  remote:
    per_second: 100
    burst_count: 500
rc_invites:
  per_room:
    per_second: 100
    burst_count: 500
  per_user:
    per_second: 100
    burst_count: 500
rc_media_create:
  per_second: 100
  burst_count: 500
