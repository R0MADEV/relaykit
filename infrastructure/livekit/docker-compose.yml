# The two pieces a Matrix conference needs, and no more: the SFU that carries the media, and the service
# that turns "this person is in this Matrix room" into a token the SFU will accept.
services:
  livekit:
    image: livekit/livekit-server:v1.8
    command: --config /etc/livekit.yaml --node-ip 127.0.0.1
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50019:50000-50019/udp"

  # It does not trust the caller: it asks the homeserver who the OpenID token belongs to, over federation.
  jwt:
    image: ghcr.io/element-hq/lk-jwt-service:latest
    environment:
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_KEY: devkey
      LIVEKIT_SECRET: devsecretdevsecretdevsecretdevse
      LK_JWT_PORT: "8080"
      # Whose people it will let in. The development homeserver calls itself this, and the service refuses to
      # start without being told: a service that admitted anybody's homeserver would admit anybody.
      LIVEKIT_FULL_ACCESS_HOMESERVERS: localhost
      # Development only: the homeserver is reached over plain HTTP.
      LIVEKIT_INSECURE_SKIP_VERIFY_TLS: "YES_I_KNOW_WHAT_I_AM_DOING"
    ports:
      - "8091:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The token service asks the homeserver who a token belongs to, and it asks the way federation is spoken:
  # its own localhost, port 8448, over TLS. A homeserver for development is none of those things — it is on
  # the machine outside, on 8008, in the clear — so this stands in the middle and translates.
  #
  # It shares the network namespace of the service on purpose: that is what makes this *be* its localhost.
  homeserver-federation:
    image: alpine/socat:latest
    network_mode: "service:jwt"
    depends_on:
      - jwt
    volumes:
      - ./certs:/certs:ro
    command: >-
      openssl-listen:8448,reuseaddr,fork,cert=/certs/federation.pem,verify=0
      TCP:host.docker.internal:8008

  # `LIVEKIT_URL` is one value doing two jobs: the token service reaches the SFU through it to make the room,
  # and it hands the same string to the browser to connect to. Inside Docker the SFU is `livekit`; to a
  # browser it is `localhost`. Only one name is true in both places, so this makes it true in here too.
  sfu-as-localhost:
    image: alpine/socat:latest
    network_mode: "service:jwt"
    depends_on:
      - jwt
    command: TCP-LISTEN:7880,reuseaddr,fork TCP:livekit:7880
