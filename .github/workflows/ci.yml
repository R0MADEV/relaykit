name: RelayKit CI

on:
  push:
  pull_request:

jobs:
  check-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Verify packages can be packed
        run: npm run pack:check

      - name: Build web example
        run: npm run build --workspace=@relaykit/example-web

      - name: Start Matrix, the same way it starts locally
        run: npm run matrix:up

      - name: Run Matrix smoke check
        run: npm run smoke:matrix

      - name: Run adapter contract tests
        run: npm run test:contract

      - name: Run the Electron renderer check
        run: xvfb-run --auto-servernum npm run check:ci --workspace=@relaykit/example-electron

      - name: Check the web example in a browser
        run: xvfb-run --auto-servernum npm run check:web-demo

      - name: Run RelayKit E2E smoke check
        run: npm run smoke:relaykit

      - name: Run RelayKit live events smoke check
        run: npm run smoke:live

      - name: Run RelayKit conversation window smoke check
        run: npm run smoke:window

      - name: Run RelayKit session revocation smoke check
        run: npm run smoke:revocation

      - name: Run RelayKit push notification smoke check
        run: npm run smoke:push

      - name: Run RelayKit chat smoke check
        run: npm run smoke:chat

      - name: Run RelayKit registration smoke check
        run: npm run smoke:registration

      - name: Run RelayKit group smoke check
        run: npm run smoke:group

      - name: Run RelayKit two device smoke check
        run: npm run smoke:devices

      - name: Run RelayKit outage smoke check
        run: npm run smoke:outage

      - name: Run RelayKit E2EE recovery smoke check
        run: npm run smoke:recovery

      - name: Run RelayKit person verification smoke check
        run: npm run smoke:user-verification

      - name: Run RelayKit code verification smoke check
        run: npm run smoke:qr

      - name: Run RelayKit SAS verification smoke check
        run: npm run smoke:verification

      - name: Start the federated pair
        run: npm run federation:up

      - name: Run RelayKit federation smoke check
        run: npm run smoke:federation

      - name: Stop the federated pair
        if: always()
        run: docker compose -f infrastructure/matrix/federation/docker-compose.yml down -v

      - name: Stop Synapse
        if: always()
        run: docker compose -f infrastructure/matrix/docker-compose.yml down -v
